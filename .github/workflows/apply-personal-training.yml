name: Apply personal training

on:
  push:
    paths:
      - tools/apply_personal_training.py
      - .github/workflows/apply-personal-training.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply personalized training patch
        run: python tools/apply_personal_training.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          if not scripts:
              raise SystemExit('No embedded script found')
          Path('/tmp/formychess.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/formychess.js

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply personalized Fritz training"
          git push
